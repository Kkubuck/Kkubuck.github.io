name: Build and Deploy

on:
  push:
    branches: [main]
  # Pull requests run the same verification without publishing, so a change can
  # be checked before it reaches the live site.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install, verify, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@10.13.1
          build-cmd: pnpm run verify

  deploy:
    needs: build
    # Never publish from a pull request; the build job is the only gate there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
