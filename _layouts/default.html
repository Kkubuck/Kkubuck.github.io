<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}" data-theme="light">
{% include head.html %}
<body class="site-body{% if page.paper %} is-paper{% endif %}" data-page-kind="{{ page.layout | default: 'page' }}" data-search-index="{{ '/search.json' | relative_url }}">
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <canvas class="weather-field" data-weather-field aria-hidden="true"></canvas>
  <div class="page-grain" aria-hidden="true"></div>
  <div class="site-shell">{{ content }}</div>
  <script src="{{ '/assets/js/app.js' | relative_url }}?v={{ site.asset_version | default: '2026-07' }}" defer></script>
</body>
</html>
