<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f0e8" id="theme-color-meta">
  <meta name="format-detection" content="telephone=no">

  {% include favicon.html %}
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.asset_version | default: '2026-07' }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      try {
        var saved = localStorage.getItem('kkubuck-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = saved || (systemDark ? 'dark' : 'light');
      } catch (error) {
        root.dataset.theme = 'light';
      }
    }());
  </script>
  {% seo %}
</head>
